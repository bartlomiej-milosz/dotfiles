add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$python\
$golang\
$cmd_duration\
$line_break\
$character"""

# ── Prompt character ─────────────────────────────────────────
[character]
success_symbol = "[❯](purple)"
error_symbol   = "[❯](red)"
vimcmd_symbol  = "[❮](green)"

# ── Directory ────────────────────────────────────────────────
[directory]
style             = "cyan bold"
truncation_length = 3
truncate_to_repo  = true
read_only         = " 󰌾"

# ── Git ──────────────────────────────────────────────────────
[git_branch]
symbol = " "
style  = "white"
format = "[$symbol$branch]($style) "

[git_status]
style    = "red"
format   = "([$all_status$ahead_behind]($style) )"
ahead    = "⇡${count}"
behind   = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
modified = "!${count}"
untracked = "?${count}"
staged   = "+${count}"
deleted  = "✘${count}"

# ── Python ───────────────────────────────────────────────────
[python]
symbol         = " "
style          = "yellow"
format         = "[${symbol}(${virtualenv} )]($style)"
detect_files   = ["requirements.txt", "pyproject.toml", "setup.py", ".python-version"]
detect_folders = [".venv", "venv"]

# ── Go ───────────────────────────────────────────────────────
[golang]
symbol       = " "
style        = "cyan"
format       = "[$symbol($version )]($style)"
detect_files = ["go.mod"]

# ── Command duration ─────────────────────────────────────────
[cmd_duration]
min_time          = 2000
format            = "[󱦟 $duration]($style) "
style             = "yellow"
show_milliseconds = false

# ── Disabled ─────────────────────────────────────────────────
[package]
disabled = true

[nodejs]
disabled = true

[rust]
disabled = true

[docker_context]
disabled = true

[conda]
disabled = true
