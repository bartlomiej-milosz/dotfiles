# ==========================================
# tmux Base Configuration
# ==========================================

# --- General Settings ---
# Change prefix from 'Ctrl+b' to 'Ctrl+a'
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Enable mouse support (clickable windows, panes, resizable panes)
set -g mouse on

# Upgrade $TERM for better colors in Neovim/Vim
set -g default-terminal "screen-256color"

# Address vim mode switching delay (critical for Neovim/Vim users)
set -s escape-time 0

# Increase scrollback buffer size
set -g history-limit 50000

# Tmux messages are displayed for 4 seconds
set -g display-time 4000

# Refresh 'status-left' and 'status-right' more often
set -g status-interval 5

# Start window and pane numbering at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows sequentially after closing any of them
set -g renumber-windows on

# --- Key Bindings ---
# Easy config reload
bind r source-file ~/.tmux.conf \; display-message "Configuration reloaded!"

# Split panes using | and - (and open in current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-like pane switching
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-like pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Copy Mode (Vim Style) ---
# Use vi keys in copy mode
setw -g mode-keys vi

# Setup 'v' to begin selection as in Vim
bind-key -T copy-mode-vi v send-keys -X begin-selection
# Setup 'y' to copy selection as in Vim
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
