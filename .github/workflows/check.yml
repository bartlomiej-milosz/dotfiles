name: Check dotfiles

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh stow shellcheck
      - name: Check syntax, shell behavior and Stow
        run: ./scripts/check.sh
